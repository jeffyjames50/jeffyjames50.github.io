- title: "Bias Analysis in Collaborative Filtering Recommender Systems"
  summary: >
    Investigated demographic bias (age and gender) in recommender-system
    predictions by reproducing experiments from a published study and
    evaluating multiple recommendation algorithms on balanced vs.
    imbalanced datasets.
  bullets:
    - "Preprocessed and analyzed a large ratings dataset to identify prediction disparities across user demographics."
    - "Implemented and fine-tuned Matrix Factorization (PMF, BiasedMF) and k-Nearest Neighbors (kNN) models."
    - "Evaluated performance using Mean Absolute Error (MAE) across balanced vs. imbalanced experimental setups."
  tags: ["Python", "Java", "CF4J", "Machine Learning", "Pandas", "NumPy", "Statistics"]
  repo: ""
  link: ""

