<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>
<meta name="description" content="Portfolio" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>

<header class="nav">
  <a class="nav-brand" href="#top">JJ</a>
  <nav class="nav-links" id="navLinks"></nav>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
  </button>
</header>

<main id="top">

  <section class="hero" id="hero">
    <img class="hero-photo" id="heroPhoto" alt="" src="" />
    <p class="hero-eyebrow" id="heroLocation"></p>
    <h1 class="hero-name" id="heroName">Loading…</h1>
    <p class="hero-role" id="heroRole"></p>
    <p class="hero-tagline" id="heroTagline"></p>
    <div class="hero-highlights" id="heroHighlights"></div>
    <div class="hero-actions">
      <a class="btn btn-primary" id="heroContactBtn" href="#contact">Get in touch</a>
      <a class="btn btn-ghost" id="heroResumeBtn" href="#" download>Download CV</a>
    </div>
    <div class="hero-social" id="heroSocial"></div>
  </section>

  <section class="section" id="about">
    <h2 class="section-title"><span class="tag">01</span> About</h2>
    <p class="about-text" id="aboutSummary"></p>
  </section>

  <section class="section" id="experience">
    <h2 class="section-title"><span class="tag">02</span> Experience</h2>
    <div class="timeline" id="experienceTimeline"></div>
  </section>

  <section class="section" id="projects">
    <h2 class="section-title"><span class="tag">03</span> Projects</h2>
    <div class="grid" id="projectsGrid"></div>
  </section>

  <section class="section" id="skills">
    <h2 class="section-title"><span class="tag">04</span> Skills</h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>

  <section class="section" id="education">
    <h2 class="section-title"><span class="tag">05</span> Education</h2>
    <div class="timeline" id="educationTimeline"></div>
    <div class="languages" id="languagesList"></div>
  </section>

  <section class="section contact-section" id="contact">
    <h2 class="section-title"><span class="tag">06</span> Contact</h2>
    <p class="contact-lead">Have a role, project or question in mind? I'd love to hear from you.</p>
    <div class="contact-grid" id="contactGrid"></div>
  </section>

</main>

<footer class="footer">
  <p id="footerText"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="script.js"></script>
</body>
</html>
